name: Daily scan

on:
  schedule:
    # Mo–Fr um 16:45 UTC (nach Xetra-Schluss, US-Börse läuft noch)
    - cron: "45 16 * * 1-5"
    # Mo–Fr um 22:30 UTC (nach US-Börsenschluss)
    - cron: "30 22 * * 1-5"
  # manueller Start: unter "Actions" -> "Daily scan" -> "Run workflow"
  # oder über den Knopf "Markt jetzt aktualisieren" in der App
  workflow_dispatch:

permissions:
  contents: write # zum Committen von results/

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      # Kursdaten aus dem letzten Lauf wiederherstellen. Der Schlüssel ist pro
      # Lauf neu, restore-keys holt den jüngsten vorhandenen Cache.
      - name: Kurs-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: |
            prices-

      - name: Tagesanalyse ausführen
        run: python src/run_daily.py

      # Auch bei einem Fehler speichern, damit bereits geladene Kurse nicht verloren gehen
      - name: Kurs-Cache speichern
        if: always() && hashFiles('data/prices/*.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}

      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "Keine Änderungen in results/"
            exit 0
          fi
          git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          # falls inzwischen Code-Änderungen gepusht wurden, darauf aufsetzen
          git pull --rebase origin main
          git push
